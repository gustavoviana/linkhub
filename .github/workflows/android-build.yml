name: Android — pacote do provedor

# Empacota a central de um provedor como app Android (Trusted Web Activity)
# e devolve o .aab assinado para o painel.
#
# Quem dispara é o botão "Gerar pacote Android" em /admin/tenants/[id]/aplicativo.
# O painel manda um passe assinado; este job usa o passe para buscar a ficha
# do app e para devolver o pacote. Nenhuma chave da Supabase entra aqui.
#
# Este repositório é público, e o log também. Por isso:
#  * o passe e a senha da keystore são mascarados (::add-mask::) antes de
#    qualquer passo que os use; o passe é lido do arquivo do evento, e não
#    escrito no script do passo;
#  * a senha vai para keytool/jarsigner por variável de ambiente
#    (-storepass:env), nunca na linha de comando;
#  * o painel só aceita o passe enquanto o build está na fila ou rodando.

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: ID do build no painel
        required: true
      api_url:
        description: Endereço do painel (https://…)
        required: true
      token:
        description: Passe assinado do build
        required: true
      version_code:
        description: versionCode reservado pelo painel
        required: true
      version_name:
        description: versionName reservado pelo painel
        required: true
      label:
        description: Nome e versão, só para aparecer na lista de execuções
        required: false

run-name: ${{ inputs.label || inputs.build_id }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Primeiro passo, antes de qualquer outro tocar no passe. O valor sai do
      # arquivo do evento: escrever a expressão do input aqui imprimiria o
      # passe no próprio script do passo, antes de a máscara valer.
      - name: Proteger segredos
        run: |
          TOKEN=$(jq -r '.inputs.token' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$TOKEN"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # O padrão da action é "tools platform-tools", e o pacote "tools" saiu
      # do repositório do SDK (out/2026): o sdkmanager falhava antes de
      # qualquer coisa do app. Listamos só o que o build usa — a plataforma
      # do compileSdk 36 e as build-tools do Android Gradle Plugin 8.9.
      - name: Preparar SDK do Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Buscar a ficha do app
        id: config
        env:
          API: ${{ inputs.api_url }}
          BUILD: ${{ inputs.build_id }}
          TOKEN: ${{ inputs.token }}
          WANT_CODE: ${{ inputs.version_code }}
          WANT_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          curl -fsS "$API/api/app-build/$BUILD?token=$TOKEN" -o config.json
          # Mascara a senha antes de qualquer outra linha poder imprimi-la.
          KS_PASS=$(jq -r '.keystore_password // empty' config.json)
          if [ -n "$KS_PASS" ]; then echo "::add-mask::$KS_PASS"; fi
          echo "app=$(jq -r .app_name config.json)" >> "$GITHUB_OUTPUT"
          echo "pkg=$(jq -r .package_id config.json)" >> "$GITHUB_OUTPUT"
          # A versão do job e a da ficha têm que ser a mesma reserva.
          GOT_CODE=$(jq -r .version_code config.json)
          GOT_NAME=$(jq -r .version_name config.json)
          if [ "$GOT_CODE" != "$WANT_CODE" ] || [ "$GOT_NAME" != "$WANT_NAME" ]; then
            echo "Versão divergente: job $WANT_NAME ($WANT_CODE), ficha $GOT_NAME ($GOT_CODE)." >&2
            exit 1
          fi
          jq 'del(.keystore_password, .keystore_base64)' config.json

      - name: Montar o projeto Android
        run: |
          set -euo pipefail
          mkdir -p /tmp/twa-tools
          cd /tmp/twa-tools
          npm init -y > /dev/null
          npm install --silent @bubblewrap/core@1.25.0
          cd "$GITHUB_WORKSPACE"
          TWA_MODULES_DIR=/tmp/twa-tools node .github/scripts/twa-project.mjs config.json projeto

      - name: Chave de assinatura
        id: signing
        run: |
          set -euo pipefail
          ALIAS=$(jq -r .keystore_alias config.json)
          KS_PASS=$(jq -r .keystore_password config.json)
          export KS_PASS
          EXISTING=$(jq -r '.keystore_base64 // empty' config.json)
          CN=$(jq -r .app_name config.json)

          if [ -n "$EXISTING" ]; then
            echo "$EXISTING" | base64 -d > projeto/android.keystore
            echo "novo=false" >> "$GITHUB_OUTPUT"
          else
            # Primeiro build deste provedor: a chave nasce aqui e volta
            # cifrada para o painel. 10000 dias (27 anos): a Play exige
            # validade até pelo menos 2033.
            keytool -genkeypair \
              -keystore projeto/android.keystore -storetype PKCS12 \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass:env KS_PASS -keypass:env KS_PASS \
              -dname "CN=$CN, OU=LinkHub, O=LinkHub, L=Brasil, S=Brasil, C=BR"
            # Certificado público, para o provedor baixar em .pem.
            keytool -exportcert -rfc -alias "$ALIAS" \
              -keystore projeto/android.keystore -storepass:env KS_PASS \
              -file projeto/upload_certificate.pem
            echo "novo=true" >> "$GITHUB_OUTPUT"
          fi

          FP=$(keytool -list -v -keystore projeto/android.keystore -alias "$ALIAS" -storepass:env KS_PASS \
               | grep -i 'SHA256:' | head -1 | sed 's/.*SHA256: *//' | tr -d ' \r')
          echo "sha256=$FP" >> "$GITHUB_OUTPUT"
          echo "Impressão digital de upload: $FP"

      - name: Compilar o pacote
        working-directory: projeto
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease

      - name: Assinar
        run: |
          set -euo pipefail
          ALIAS=$(jq -r .keystore_alias config.json)
          KS_PASS=$(jq -r .keystore_password config.json)
          export KS_PASS
          AAB=projeto/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verbose:false -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore projeto/android.keystore \
            -storepass:env KS_PASS -keypass:env KS_PASS \
            "$AAB" "$ALIAS"
          jarsigner -verify "$AAB" > /dev/null
          ls -lh "$AAB"

      - name: Devolver o pacote ao painel
        if: success()
        env:
          API: ${{ inputs.api_url }}
          BUILD: ${{ inputs.build_id }}
          TOKEN: ${{ inputs.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NOVO: ${{ steps.signing.outputs.novo }}
          FP: ${{ steps.signing.outputs.sha256 }}
        run: |
          set -euo pipefail
          ARGS=(-F "status=done" -F "run_url=$RUN"
                -F "aab=@projeto/app/build/outputs/bundle/release/app-release.aab")
          if [ "$NOVO" = "true" ]; then
            ARGS+=(-F "keystore=@projeto/android.keystore"
                   -F "upload_cert=@projeto/upload_certificate.pem"
                   -F "keystore_sha256=$FP")
          fi
          curl -fsS -X POST "${ARGS[@]}" "$API/api/app-build/$BUILD?token=$TOKEN"

      - name: Avisar a falha
        if: failure()
        env:
          API: ${{ inputs.api_url }}
          BUILD: ${{ inputs.build_id }}
          TOKEN: ${{ inputs.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST \
            -F "status=error" \
            -F "run_url=$RUN" \
            -F "error=O build falhou. Abra o log da execução para ver em qual passo." \
            "$API/api/app-build/$BUILD?token=$TOKEN" || true
