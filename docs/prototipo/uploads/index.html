<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Net Core — Sistema para Provedores de Internet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Sidebar — always dark, slightly violet-tinted */
    --sb-bg: #0a0c14;
    --sb-bg-2: #11141d;
    --sb-border: #1c2030;
    --sb-text: #eef1f8;
    --sb-text-dim: #8a92a6;
    --sb-text-muted: #5b6378;
    --sb-hover: #161a26;
    --sb-active: #1d2233;

    /* App — light by default */
    --bg: #fafbfd;
    --bg-2: #ffffff;
    --bg-3: #f3f4f8;
    --border: #e7e8ee;
    --border-strong: #d6d8e0;
    --text: #0d0f17;
    --text-2: #525866;
    --text-3: #8a90a0;

    /* Brand: refined purple + cyan (less saturated than legacy) */
    --accent: #6d4ae0;            /* primary */
    --accent-2: #5837cc;
    --accent-3: #4628b0;
    --accent-soft: #f1edff;
    --accent-border: #ddd2ff;
    --cyan: #0aa5c0;
    --cyan-soft: #e6f8fb;
    --cyan-border: #b6e7f0;

    --green: #15915a;
    --green-soft: #ecfaf1;
    --green-border: #b9eccd;
    --red: #d6334a;
    --red-soft: #fdf0f2;
    --red-border: #f7c8d0;
    --amber: #b8730e;
    --amber-soft: #fdf6e8;
    --amber-border: #f0d9a3;
    --blue: #2660d4;
    --blue-soft: #eef3fd;
    --blue-border: #c7d6f4;
    --violet: #6d4ae0;
    --violet-soft: #f1edff;
    --pink: #d83a8c;
    --pink-soft: #fdeef5;

    /* Chart palette (matches brand requirement) */
    --chart-1: #6d4ae0;
    --chart-2: #0aa5c0;
    --chart-3: #15915a;
    --chart-4: #b8730e;
    --chart-5: #d6334a;
    --chart-6: #d83a8c;

    --radius-sm: 4px;
    --radius: 6px;
    --radius-md: 8px;
    --radius-lg: 10px;
    --radius-xl: 14px;
    --shadow-sm: 0 1px 2px rgba(15,16,27,0.04);
    --shadow: 0 1px 2px rgba(15,16,27,0.04), 0 4px 8px -4px rgba(15,16,27,0.05);
    --shadow-lg: 0 12px 28px -8px rgba(15,16,27,0.12), 0 6px 10px -8px rgba(15,16,27,0.06);
    --shadow-glow: 0 0 0 1px rgba(109,74,224,0.18), 0 8px 24px -8px rgba(109,74,224,0.30);

    --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  [data-theme="dark"] {
    --bg: #07090f;
    --bg-2: #0f131c;
    --bg-3: #161b27;
    --border: #232a3a;
    --border-strong: #303a4f;
    --text: #eef1f8;
    --text-2: #9ca3b6;
    --text-3: #6b7388;
    --accent: #8a6df5;
    --accent-2: #6d4ae0;
    --accent-3: #5837cc;
    --accent-soft: rgba(138,109,245,0.14);
    --accent-border: rgba(138,109,245,0.32);
    --cyan: #2bc5e0;
    --cyan-soft: rgba(43,197,224,0.12);
    --cyan-border: rgba(43,197,224,0.30);
    --green: #2bc080;
    --green-soft: rgba(43,192,128,0.12);
    --green-border: rgba(43,192,128,0.30);
    --red: #ef5572;
    --red-soft: rgba(239,85,114,0.12);
    --red-border: rgba(239,85,114,0.30);
    --amber: #e8a738;
    --amber-soft: rgba(232,167,56,0.13);
    --amber-border: rgba(232,167,56,0.30);
    --blue: #5b8df5;
    --blue-soft: rgba(91,141,245,0.12);
    --blue-border: rgba(91,141,245,0.30);
    --violet: #8a6df5;
    --violet-soft: rgba(138,109,245,0.14);
    --pink: #ee5fa3;
    --pink-soft: rgba(238,95,163,0.12);

    --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
    --shadow: 0 1px 0 rgba(255,255,255,.02), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lg: 0 12px 40px -12px rgba(0,0,0,0.6), 0 4px 12px rgba(0,0,0,0.5);
    --shadow-glow: 0 0 0 1px rgba(138,109,245,0.30), 0 0 24px rgba(138,109,245,0.25);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: var(--accent-soft); color: var(--accent-3); }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; }

  .app-root {
    display: grid;
    grid-template-columns: 240px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* ===== Sidebar (always dark) ===== */
  .sidebar {
    background: var(--sb-bg);
    border-right: 1px solid var(--sb-border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    color: var(--sb-text);
  }
  .sb-brand {
    padding: 16px 16px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--sb-border);
  }
  .sb-logo {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: linear-gradient(135deg, #8a6df5 0%, #6d4ae0 60%, #5837cc 100%);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    color: white;
    font-size: 13px;
    letter-spacing: -0.04em;
    box-shadow: 0 0 0 1px rgba(138,109,245,0.4), 0 4px 12px -2px rgba(109,74,224,0.45);
  }
  .sb-brand-text {
    display: flex; flex-direction: column;
    line-height: 1.1;
  }
  .sb-brand-name {
    font-size: 14px; font-weight: 600; color: var(--sb-text);
  }
  .sb-brand-tenant {
    font-size: 11px; color: var(--sb-text-dim);
    margin-top: 2px;
  }
  .sb-tenant-switch {
    margin: 12px 12px 4px;
    background: var(--sb-bg-2);
    border: 1px solid var(--sb-border);
    border-radius: 6px;
    padding: 8px 10px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px;
    cursor: pointer;
  }
  .sb-tenant-switch:hover { background: var(--sb-hover); }
  .sb-tenant-name { flex: 1; color: var(--sb-text); font-weight: 500; }
  .sb-tenant-meta { color: var(--sb-text-muted); font-size: 10px; font-family: var(--font-mono); }

  .sb-section {
    padding: 12px 0 4px;
  }
  .sb-section-label {
    padding: 0 16px 6px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--sb-text-muted);
  }
  .sb-item {
    display: flex; align-items: center; gap: 10px;
    margin: 0 8px;
    padding: 6px 10px;
    color: var(--sb-text-dim);
    font-size: 12.5px;
    cursor: pointer;
    border-radius: 6px;
    user-select: none;
    position: relative;
  }
  .sb-item:hover { background: var(--sb-hover); color: var(--sb-text); }
  .sb-item.active {
    background: linear-gradient(90deg, rgba(109,74,224,0.18), rgba(109,74,224,0.06));
    color: var(--sb-text);
    box-shadow: inset 0 0 0 1px rgba(138,109,245,0.18);
  }
  .sb-item.active::before {
    content: ''; position: absolute; left: -8px; top: 6px; bottom: 6px;
    width: 2px; border-radius: 2px;
    background: linear-gradient(180deg, #8a6df5, #5837cc);
    box-shadow: 0 0 8px rgba(138,109,245,0.6);
  }
  .sb-item-sub {
    margin-left: 30px;
    font-size: 12px;
    padding: 5px 10px;
    color: var(--sb-text-muted);
  }
  .sb-item-sub.active { color: var(--sb-text); background: var(--sb-hover); border-radius: 4px; }
  .sb-item-sub:hover { color: var(--sb-text); }
  .sb-item-icon {
    width: 16px; height: 16px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .sb-item-label { flex: 1; }
  .sb-item-badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-weight: 600;
    font-family: var(--font-mono);
  }
  .sb-item-badge.muted {
    background: var(--sb-bg-2);
    color: var(--sb-text-dim);
    border: 1px solid var(--sb-border);
  }

  .sb-footer {
    margin-top: auto;
    padding: 12px;
    border-top: 1px solid var(--sb-border);
  }
  .sb-user {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
  }
  .sb-user:hover { background: var(--sb-hover); }
  .sb-user-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: #2d3441;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: var(--sb-text);
  }
  .sb-user-info { flex: 1; line-height: 1.2; }
  .sb-user-name { font-size: 12px; color: var(--sb-text); font-weight: 500; }
  .sb-user-role { font-size: 10px; color: var(--sb-text-muted); }

  /* ===== Main panel ===== */
  .main {
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .topbar {
    height: 48px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-2);
    display: flex; align-items: center;
    padding: 0 20px;
    gap: 16px;
    flex-shrink: 0;
  }
  .topbar-breadcrumb {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px;
    color: var(--text-2);
  }
  .topbar-breadcrumb .crumb-current { color: var(--text); font-weight: 500; }
  .topbar-search {
    flex: 1; max-width: 380px;
    position: relative;
  }
  .topbar-search input {
    width: 100%;
    height: 30px;
    padding: 0 10px 0 32px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font-size: 12px;
    outline: none;
  }
  .topbar-search input:focus { border-color: var(--accent); }
  .topbar-search input { padding-right: 50px; cursor: pointer; }
  .topbar-search svg {
    position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
    color: var(--text-3);
  }
  .topbar-search .kbd {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    font-family: var(--font-mono); font-size: 10px;
    padding: 2px 6px; border-radius: 4px;
    background: var(--bg-3); color: var(--text-2);
    border: 1px solid var(--border);
  }
  .kbd { font-family: var(--font-mono); font-size: 10px; padding: 2px 5px; border-radius: 3px; background: var(--bg-3); border: 1px solid var(--border); color: var(--text-2); }

  /* Kanban */
  .kanban { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: flex-start; }
  .kanban-col { flex: 0 0 280px; background: var(--bg-3); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
  .kanban-col-head { display: flex; align-items: center; gap: 8px; padding: 4px 6px 10px; }
  .kanban-col-title { font-size: 12px; font-weight: 600; }
  .kanban-col-count { font-size: 10px; padding: 1px 6px; border-radius: 8px; background: var(--bg-2); color: var(--text-2); border: 1px solid var(--border); font-family: var(--font-mono); }
  .kanban-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin-bottom: 6px; cursor: grab; box-shadow: var(--shadow-sm); }
  .kanban-card:hover { border-color: var(--accent-border); }
  .kanban-card-title { font-size: 12px; font-weight: 600; margin-bottom: 3px; }
  .kanban-card-meta { font-size: 11px; color: var(--text-2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  /* Calendar */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-left: 1px solid var(--border); border-top: 1px solid var(--border); }
  .cal-head { padding: 8px 10px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-2); background: var(--bg-3); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .cal-cell { min-height: 100px; padding: 6px 8px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); font-size: 11px; background: var(--bg-2); }
  .cal-cell.outside { background: var(--bg); color: var(--text-3); }
  .cal-cell.today .cal-day { background: var(--accent); color: white; }
  .cal-day { display: inline-flex; width: 22px; height: 22px; align-items: center; justify-content: center; border-radius: 50%; font-weight: 600; }
  .cal-event { display: block; padding: 2px 6px; border-radius: 3px; margin-top: 3px; font-size: 10px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Map placeholder */
  .map-canvas {
    height: 520px;
    background: var(--bg-3);
    border-radius: 8px;
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
    background-image:
      linear-gradient(rgba(109,74,224,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(109,74,224,0.06) 1px, transparent 1px),
      radial-gradient(ellipse at 30% 40%, rgba(43,197,224,0.12), transparent 60%),
      radial-gradient(ellipse at 70% 60%, rgba(109,74,224,0.10), transparent 60%);
    background-size: 36px 36px, 36px 36px, auto, auto;
  }
  .map-pin { position: absolute; width: 14px; height: 14px; border-radius: 50%; transform: translate(-50%,-50%); box-shadow: 0 0 0 3px var(--bg-2), 0 2px 6px rgba(0,0,0,0.15); cursor: pointer; }
  .map-cluster { position: absolute; min-width: 36px; height: 36px; padding: 0 10px; border-radius: 18px; background: rgba(109,74,224,0.85); color: white; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; transform: translate(-50%,-50%); box-shadow: 0 4px 12px rgba(109,74,224,0.4); }
  .map-controls { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 4px; }
  .map-legend { position: absolute; bottom: 12px; left: 12px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 11px; box-shadow: var(--shadow); }

  /* Cmd-K palette */
  .cmdk-overlay { position: fixed; inset: 0; background: rgba(7,9,15,0.5); backdrop-filter: blur(4px); z-index: 1000; display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh; }
  .cmdk { width: 580px; max-width: 90vw; background: var(--bg-2); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg); overflow: hidden; }
  .cmdk-input-wrap { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .cmdk-input { flex: 1; border: none; outline: none; background: transparent; font-size: 14px; color: var(--text); font-family: inherit; }
  .cmdk-list { max-height: 380px; overflow-y: auto; padding: 6px; }
  .cmdk-section { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); padding: 8px 10px 4px; }
  .cmdk-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .cmdk-item:hover, .cmdk-item.active { background: var(--accent-soft); color: var(--accent-3); }
  .cmdk-meta { margin-left: auto; font-size: 10px; color: var(--text-3); font-family: var(--font-mono); }

  /* Status badge dot variants — finer */
  .badge-cyan { background: var(--cyan-soft); color: var(--cyan); border-color: var(--cyan-border); }
  .badge-pink { background: var(--pink-soft); color: var(--pink); border-color: var(--blue-border); }

  /* Wizard */
  .wiz-nav { display: flex; align-items: center; gap: 0; margin-bottom: 18px; padding: 12px 16px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; }
  .wiz-step { display: flex; align-items: center; gap: 8px; padding: 4px 12px; font-size: 12px; color: var(--text-3); white-space: nowrap; }
  .wiz-step.active { color: var(--text); }
  .wiz-step.done { color: var(--green); }
  .wiz-num { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; background: var(--bg-3); border: 1px solid var(--border); }
  .wiz-step.active .wiz-num { background: var(--accent); color: white; border-color: var(--accent); }
  .wiz-step.done .wiz-num { background: var(--green); color: white; border-color: var(--green); }
  .wiz-line { flex: 1; height: 1px; background: var(--border); min-width: 16px; }

  /* Empty state */
  .empty { text-align: center; padding: 60px 20px; color: var(--text-2); }
  .empty-icon { width: 48px; height: 48px; border-radius: 12px; background: var(--bg-3); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px; color: var(--text-3); }
  .empty-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .empty-desc { font-size: 12px; max-width: 320px; margin: 0 auto 16px; }

  /* Timeline */
  .tl { position: relative; padding-left: 28px; }
  .tl::before { content: ''; position: absolute; left: 9px; top: 4px; bottom: 4px; width: 2px; background: var(--border); border-radius: 1px; }
  .tl-item { position: relative; padding-bottom: 16px; }
  .tl-dot { position: absolute; left: -23px; top: 4px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg-2); border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; }
  .tl-dot.green { border-color: var(--green); }
  .tl-dot.amber { border-color: var(--amber); }
  .tl-dot.red { border-color: var(--red); }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(7,9,15,0.5); backdrop-filter: blur(4px); z-index: 999; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .modal { width: 580px; max-width: 100%; background: var(--bg-2); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg); max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
  .modal-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-body { padding: 18px; overflow-y: auto; }
  .modal-foot { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
  .topbar-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .topbar-btn {
    width: 30px; height: 30px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-2);
    color: var(--text-2);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .topbar-btn:hover { background: var(--bg); color: var(--text); }
  .topbar-btn .dot {
    position: absolute; top: 5px; right: 5px;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--red);
  }
  .topbar-divider { width: 1px; height: 20px; background: var(--border); }

  .content {
    flex: 1;
    overflow-y: auto;
    background: var(--bg);
  }

  /* ===== Page primitives ===== */
  .page { padding: 20px 24px 60px; }
  .page-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    margin-bottom: 18px;
    gap: 16px;
  }
  .page-title { font-size: 20px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  .page-subtitle { font-size: 13px; color: var(--text-2); margin: 0; }
  .page-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

  .btn {
    height: 30px;
    padding: 0 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-2);
    color: var(--text);
    font-size: 12px;
    font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background .12s, border-color .12s, color .12s;
  }
  .btn:hover { background: var(--bg-3); border-color: var(--border-strong); }
  .btn:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .btn-primary {
    background: linear-gradient(180deg, #7e5bee 0%, #6d4ae0 100%);
    color: white;
    border-color: #5837cc;
    box-shadow: 0 1px 0 rgba(255,255,255,0.15) inset, 0 1px 2px rgba(15,16,27,0.1);
  }
  .btn-primary:hover { background: linear-gradient(180deg, #6d4ae0 0%, #5837cc 100%); border-color: #4628b0; }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
  .btn-ghost:hover { background: var(--bg-3); color: var(--text); }
  .btn-sm { height: 26px; padding: 0 8px; font-size: 11px; }
  .btn-icon { width: 30px; padding: 0; justify-content: center; }
  .btn-danger { color: var(--red); }
  .btn-danger:hover { background: var(--red-soft); border-color: var(--red-border); }

  .card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .card-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .card-title { font-size: 13px; font-weight: 600; margin: 0; }
  .card-subtitle { font-size: 11px; color: var(--text-2); margin: 2px 0 0; }
  .card-body { padding: 16px; }
  .card-toolbar { display: flex; gap: 6px; align-items: center; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    height: 20px; padding: 0 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
    border: 1px solid;
    white-space: nowrap;
  }
  .badge-green { background: var(--green-soft); color: var(--green); border-color: var(--green-border); }
  .badge-red { background: var(--red-soft); color: var(--red); border-color: var(--red-border); }
  .badge-amber { background: var(--amber-soft); color: var(--amber); border-color: var(--amber-border); }
  .badge-blue { background: var(--blue-soft); color: var(--blue); border-color: var(--blue-border); }
  .badge-violet { background: var(--violet-soft); color: var(--violet); border-color: var(--blue-border); }
  .badge-gray { background: var(--bg-3); color: var(--text-2); border-color: var(--border); }
  .badge-orange { background: var(--accent-soft); color: var(--accent-2); border-color: var(--accent-border); }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* ===== Tables ===== */
  .table { width: 100%; border-collapse: collapse; }
  .table th {
    text-align: left;
    font-weight: 500;
    font-size: 11px;
    color: var(--text-2);
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    position: sticky;
    top: 0;
  }
  .table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text);
    vertical-align: middle;
  }
  .table tbody tr:hover { background: var(--bg); cursor: pointer; }
  .table tbody tr:last-child td { border-bottom: none; }
  .table .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .table .col-actions { width: 40px; text-align: right; }
  .table .checkbox-col { width: 32px; }

  /* ===== KPI ===== */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .kpi {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    position: relative;
  }
  .kpi-label {
    font-size: 11px;
    color: var(--text-2);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 500;
    display: flex; align-items: center; gap: 6px;
  }
  .kpi-value {
    font-size: 22px;
    font-weight: 600;
    margin-top: 6px;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .kpi-meta {
    margin-top: 6px;
    font-size: 11px;
    display: flex; align-items: center; gap: 6px;
  }
  .kpi-delta { font-weight: 500; font-family: var(--font-mono); }
  .kpi-delta.up { color: var(--green); }
  .kpi-delta.down { color: var(--red); }
  .kpi-spark {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 28px;
    pointer-events: none;
    opacity: 0.6;
    overflow: hidden;
    border-bottom-left-radius: 8px;
    border-bottom-right-radius: 8px;
  }
  .kpi { overflow: hidden; }

  /* ===== Form controls ===== */
  .input, .select, .textarea {
    width: 100%;
    height: 32px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-2);
    color: var(--text);
    font-size: 12px;
    outline: none;
  }
  .textarea { height: auto; padding: 8px 10px; resize: vertical; min-height: 64px; }
  .input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(249,115,22,0.1); }
  .label { font-size: 11px; color: var(--text-2); font-weight: 500; margin-bottom: 4px; display: block; text-transform: uppercase; letter-spacing: 0.04em; }
  .field { display: flex; flex-direction: column; }
  .field-row { display: flex; gap: 12px; margin-bottom: 12px; }
  .field-row > .field { flex: 1; }

  /* ===== Tabs ===== */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    gap: 0;
    margin-bottom: 16px;
  }
  .tab {
    padding: 8px 14px;
    font-size: 12px;
    color: var(--text-2);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    font-weight: 500;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab-count {
    margin-left: 6px;
    background: var(--bg-3);
    color: var(--text-2);
    padding: 1px 6px;
    border-radius: 10px;
    font-size: 10px;
    font-family: var(--font-mono);
  }
  .tab.active .tab-count { background: var(--accent-soft); color: var(--accent-2); }

  /* ===== Misc ===== */
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .grow { flex: 1; }
  .mono { font-family: var(--font-mono); }
  .muted { color: var(--text-2); }
  .num-tab { font-variant-numeric: tabular-nums; }

  .filter-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .filter-chip {
    height: 26px;
    padding: 0 10px;
    border-radius: 13px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-2);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .filter-chip.active { background: var(--accent-soft); color: var(--accent-2); border-color: var(--accent-border); }
  .filter-chip:hover { color: var(--text); }

  .progress {
    height: 6px;
    border-radius: 3px;
    background: var(--bg-3);
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
  }

  .avatar {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--bg-3);
    color: var(--text);
    font-size: 10px;
    font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }
  .sidebar ::-webkit-scrollbar-thumb { background: var(--sb-border); }

  /* ===== Phone mockup wrapper ===== */
  .phone-stage {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 420px));
    gap: 32px;
    padding: 20px;
    justify-content: center;
    align-items: start;
  }
  .phone-frame {
    width: 380px;
    height: 780px;
    background: #0b0d10;
    border-radius: 44px;
    padding: 14px;
    box-shadow: 0 30px 60px -12px rgba(0,0,0,0.25), 0 0 0 1px rgba(0,0,0,0.05);
    position: relative;
  }
  .phone-screen {
    width: 100%; height: 100%;
    background: var(--bg);
    border-radius: 32px;
    overflow: hidden;
    position: relative;
    display: flex; flex-direction: column;
  }
  .phone-notch {
    position: absolute;
    top: 22px; left: 50%; transform: translateX(-50%);
    width: 100px; height: 26px;
    background: #0b0d10;
    border-radius: 14px;
    z-index: 10;
  }
  .phone-status {
    height: 44px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px 0;
    font-size: 13px;
    font-weight: 600;
  }
  .phone-home {
    position: absolute;
    bottom: 6px; left: 50%; transform: translateX(-50%);
    width: 130px; height: 4px;
    background: var(--text);
    border-radius: 2px;
    opacity: 0.4;
  }
  .phone-label {
    text-align: center;
    font-size: 11px;
    color: var(--text-2);
    margin-top: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
  }

  /* ===== Mikrotik / network ===== */
  .net-tile {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
  }
  .net-status-led {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 3px rgba(22,163,74,0.15);
    flex-shrink: 0;
  }
  .net-status-led.warn { background: var(--amber); box-shadow: 0 0 0 3px rgba(217,119,6,0.15); }
  .net-status-led.err { background: var(--red); box-shadow: 0 0 0 3px rgba(220,38,38,0.15); }

  /* sparkline svg styling */
  .spark-line { fill: none; stroke: var(--accent); stroke-width: 1.5; }
  .spark-area { fill: var(--accent); opacity: 0.1; }

  /* loader fallback */
  .booting {
    display: flex; align-items: center; justify-content: center;
    height: 100vh;
    color: var(--text-2);
    font-size: 13px;
  }

  /* segmented */
  .seg {
    display: inline-flex;
    background: var(--bg-3);
    border-radius: 6px;
    padding: 2px;
    gap: 2px;
  }
  .seg-btn {
    padding: 4px 10px;
    font-size: 11px;
    color: var(--text-2);
    border: none;
    background: transparent;
    border-radius: 4px;
    font-weight: 500;
  }
  .seg-btn.active {
    background: var(--bg-2);
    color: var(--text);
    box-shadow: var(--shadow-sm);
  }
</style>
</head>
