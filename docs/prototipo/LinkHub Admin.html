<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LinkHub Admin — Login &amp; Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html,body,#root{margin:0;height:100%;overflow:hidden}
  body{font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}
  input::placeholder{color:#8f8ba5}
  a{color:#7c5cfc;text-decoration:none}a:hover{color:#5b3ee0}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(140,135,165,.4);border-radius:5px}::-webkit-scrollbar-thumb:hover{background:rgba(140,135,165,.7)}
</style>
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#7c5cfc"/><text x="50" y="50" font-family="system-ui" font-size="34" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">LH</text></svg>
</template>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="src/shared.jsx"></script>
<script type="text/babel" src="src/admin-tokens.jsx"></script>
<script type="text/babel" src="src/admin-login.jsx"></script>
<script type="text/babel" src="src/admin-dash.jsx"></script>
<script type="text/babel" data-presets="env,react">
function Controls({dark,t,view,setView,setDark}){
  const [open,setOpen]=React.useState(false);
  const btn={height:32,padding:'0 12px',borderRadius:16,background:t.surface,border:`1px solid ${t.border}`,color:t.text,fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:6,whiteSpace:'nowrap'};
  return (
    <div style={{position:'fixed',bottom:16,right:16,zIndex:999,display:'flex',alignItems:'center',gap:6}}>
      {open&&(
        <div style={{display:'flex',gap:6,background:t.surface,border:`1px solid ${t.border}`,borderRadius:20,padding:4,boxShadow:'0 8px 24px -8px rgba(0,0,0,.28)'}}>
          <button onClick={()=>setView(v=>v==='login'?'dash':'login')} style={{...btn,border:'none',background:'transparent'}}>
            <window.Icon name={view==='login'?'stats':'lock'} size={14}/>{view==='login'?'Dashboard':'Login'}
          </button>
          <button onClick={()=>setDark(d=>!d)} style={{...btn,border:'none',background:'transparent'}}>
            <window.Icon name={dark?'sun':'moon'} size={14}/>{dark?'Light':'Dark'}
          </button>
        </div>
      )}
      <button onClick={()=>setOpen(o=>!o)} title="Controles do protótipo" style={{width:32,height:32,borderRadius:16,background:open?t.accent:t.surface,border:`1px solid ${open?t.accent:t.border}`,color:open?'#fff':t.text2,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 6px 18px -6px rgba(0,0,0,.25)',opacity:open?1:.75,flexShrink:0}}>
        <window.Icon name={open?'x':'settings'} size={14}/>
      </button>
    </div>
  );
}
function App(){
  const [dark,setDark]=React.useState(()=>localStorage.getItem('lh-theme')==='dark');
  const [view,setView]=React.useState(()=>localStorage.getItem('lh-view')||'login');
  React.useEffect(()=>{localStorage.setItem('lh-theme',dark?'dark':'light')},[dark]);
  React.useEffect(()=>{localStorage.setItem('lh-view',view)},[view]);
  const t=window.LHTokens(dark);
  return (
    <div style={{width:'100vw',height:'100vh',position:'relative',background:t.bg}}>
      {view==='login'
        ? <window.AdminLogin dark={dark} onEnter={()=>setView('dash')}/>
        : <window.AdminDash dark={dark} onLogout={()=>setView('login')}/>}
      <Controls dark={dark} t={t} view={view} setView={setView} setDark={setDark}/>
    </div>
  );
}
(function start(){
  if(!window.AdminLogin||!window.AdminDash||!window.LHTokens||!window.Icon)return setTimeout(start,40);
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
})();
</script>
</body>
</html>
